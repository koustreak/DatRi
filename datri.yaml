# datri.yaml — DatRi configuration
# Declare multiple resources in one file. Each gets its own API server.

# ─── Global ────────────────────────────────────────────────────────────────────
global:
  log:
    level: info # debug | info | warn | error
    format: console # json | console

  auth:
    enabled: false

  cors:
    enabled: true
    origins: [ "*" ]
    methods: [ GET, POST, PUT, DELETE, OPTIONS ]
    headers: [ Content-Type, Authorization ]

# ─── Resources ─────────────────────────────────────────────────────────────────
resources:
  # ── Local Postgres → REST on :8080 ─────────────────────────────────────────
  - name: local-postgres
    type: database

    database:
      driver: postgres
      dsn: "postgres://postgres:postgres@localhost:5432/postgres"
      pool:
        max_conns: 10
        min_conns: 2
        max_conn_lifetime: 30m
        max_conn_idle_time: 5m
      timeouts:
        connect: 10s
        query: 30s

    server:
      host: "0.0.0.0"
      port: 8080
      protocols: [ rest ]
